<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المركزية - البطولات</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #111827; --accent-color: #3b82f6; --danger-color: #ef4444; --success-color: #10b981; --text-main: #f3f4f6; --border-color: #1f2937; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-main); padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2, h3 { color: #60a5fa; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #0d1322; color: var(--text-main); box-sizing: border-box; }
        button { background: var(--accent-color); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-danger { background: var(--danger-color); padding: 6px 12px; font-size: 13px; width: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0d1322; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: #1f2937; color: #60a5fa; }
        img.squad-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="adminPanel" style="display: none;">
    <h2>🔒 إدارة البطولات واللاعبين</h2>

    <div class="card">
        <h3>إنشاء بطولة جديدة</h3>
        <form id="tournamentForm">
            <div class="form-group">
                <label>اسم البطولة:</label>
                <input type="text" id="tourName" required placeholder="مثال: بطولة الموسم الأول">
            </div>
            <div class="form-group">
                <label>اسم اللعبة:</label>
                <input type="text" id="gameName" required placeholder="PUBG Mobile">
            </div>
            <div class="form-group">
                <label>الحد الأقصى لعدد اللاعبين:</label>
                <input type="number" id="maxPlayers" value="16" required>
            </div>
            <button type="submit">إطلاق البطولة</button>
        </form>
    </div>

    <div class="card">
        <h3>البطولات الحالية</h3>
        <div id="tournamentsList">جاري التحميل...</div>
    </div>

    <div class="card">
        <h3>اللاعبون المسجلون</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>التليفون</th>
                        <th>الـ ID</th>
                        <th>التشكيلة</th>
                        <th>الوصية</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="playersTableBody">
                    <tr><td colspan="6" style="color:#9ca3af;">لا يوجد لاعبين.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://pudnffhwusacrquqcjei.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Sveiq2WcgtBoIa7KMjlK3g_MCFXLVjK";

async function checkAuth() {
    const { value: password } = await Swal.fire({
        title: 'دخول الأدمن',
        input: 'password',
        inputPlaceholder: 'كلمة المرور',
        allowOutsideClick: false,
        background: '#111827', color: '#f3f4f6'
    });
    if (password === "taj2026") {
        document.getElementById('adminPanel').style.display = 'block';
        loadTournaments();
        loadPlayers();
    } else {
        checkAuth();
    }
}

document.getElementById('tournamentForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const title = document.getElementById('tourName').value;
    const game_name = document.getElementById('gameName').value;
    const max_players = parseInt(document.getElementById('maxPlayers').value);

    const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ title, game_name, max_players, status: 'open' })
    });

    if (res.ok) {
        Swal.fire('نجاح', 'تم إطلاق البطولة بنجاح!', 'success');
        document.getElementById('tournamentForm').reset();
        loadTournaments();
    }
});

async function loadTournaments() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments?select=*`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const tours = await res.json();
    document.getElementById('tournamentsList').innerHTML = tours.map(t => `
        <div style="background:#0d1322; padding:12px; margin-bottom:8px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; border: 1px solid #1f2937;">
            <span><b>${t.title}</b> (${t.game_name}) - الحد الأقصى: ${t.max_players}</span>
            <span style="color:#10b981; font-weight:bold;">الحالة: ${t.status}</span>
        </div>
    `).join('');
}

async function loadPlayers() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?select=*`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const players = await res.json();
    const tbody = document.getElementById('playersTableBody');
    if(!players.length) { tbody.innerHTML = `<tr><td colspan="6" style="color:#9ca3af;">لا يوجد لاعبين.</td></tr>`; return; }

    tbody.innerHTML = players.map(p => `
        <tr>
            <td>${p.name}</td>
            <td>${p.phone}</td>
            <td>${p.game_id}</td>
            <td><img src="${p.squad_image_url}" class="squad-thumb" onclick="window.open('${p.squad_image_url}', '_blank')"></td>
            <td>${p.tawseya || 'بدون'}</td>
            <td><button class="btn-danger" onclick="deletePlayer(${p.id})">حذف</button></td>
        </tr>
    `).join('');
}

async function deletePlayer(id) {
    await fetch(`${SUPABASE_URL}/rest/v1/players?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    loadPlayers();
}

checkAuth();
</script>
</body>
</html>
