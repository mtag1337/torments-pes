<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المركزية - البطولات</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b0f19; color: #f3f4f6; padding: 20px; margin: 0; }
        .container { max-width: 950px; margin: auto; }
        .card { background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2, h3 { color: #60a5fa; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #0d1322; color: #fff; box-sizing: border-box; }
        .btn-main { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-edit { background: #3b82f6; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-edit:hover { background: #2563eb; }
        .btn-bracket { background: #10b981; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold; display: inline-block; transition: 0.2s; }
        .btn-bracket:hover { background: #059669; }
        .btn-track { background: #8b5cf6; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; display: inline-block; }
        .btn-track:hover { background: #7c3aed; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #0d1322; border-radius: 6px; overflow: hidden; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #1f2937; font-size: 14px; }
        th { background: #1f2937; color: #60a5fa; }
        img.squad-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #3b82f6; }
        img.squad-thumb:hover { transform: scale(1.1); }
        .tour-item { background: #0d1322; padding: 10px 15px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1f2937; flex-wrap: wrap; gap: 10px; }
        .tour-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .badge-live { background: #dc2626; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container" id="panel" style="display: none;">
    <h2>🎮 لوحة تحكم المنظم والبطولات</h2>

    <!-- قسم إنشاء البطولة -->

            <div class="form-group">
                <label>اسم اللعبة:</label>
                <input type="text" id="tGame" required placeholder="PUBG Mobile / eFootball">

            <div class="form-group">

        </div>
        <button onclick="runAndSaveDraw()" class="btn-main" style="background: #10b981; max-width: 400px; margin: auto;">بدء القرعة عشوائياً وحفظها 🔥</button>
        <div id="drawResult" style="margin-top: 15px; text-align: right;"></div>
    </div>

    <!-- اللاعبون المسجلون -->
    <div class="card">
        <h3>اللاعبون المسجلون بالبطولة</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>البطولة المشارك بها</th>
                        <th>التليفون</th>
                        <th>الـ ID</th>
                        <th>التشكيلة</th>
                        <th>الوصية</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="pBody">
                    <tr><td colspan="7" style="color: #9ca3af;">لا يوجد لاعبين مسجلين.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://pudnffhwusacrquqcjei.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Sveiq2WcgtBoIa7KMjlK3g_MCFXLVjK";

let globalTournaments = []; 
let globalPlayers = [];     

// حماية الباسورد
async function auth() {
    const { value: pass } = await Swal.fire({ title: 'كلمة مرور الأدمن', input: 'password', allowOutsideClick: false, background: '#111827', color: '#fff' });
    if (pass === "taj2026") {
        document.getElementById('panel').style.display = 'block';
        await loadTours();
        await loadPlayers();
    } else { auth(); }
}

// دالة لتحويل روابط يوتيوب إلى Embed
function formatYoutubeUrl(url) {
    if (!url) return '';
    url = url.trim();
    let videoId = '';
    if (url.includes('/live/')) {
        videoId = url.split('/live/')[1].split('?')[0];
    } else if (url.includes('watch?v=')) {
        videoId = url.split('watch?v=')[1];
        if (videoId.includes('&')) { videoId = videoId.split('&')[0]; }
    } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
    } else if (url.includes('/embed/')) {
        videoId = url.split('/embed/')[1].split('?')[0];
    } else {
        videoId = url;
    }
    if (videoId) { return `https://www.youtube.com/embed/${videoId}`; }
    return url;
}

// إنشاء بطولة جديدة
document.getElementById('createTourForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('tTitle').value;
    const game_name = document.getElementById('tGame').value;
    const max_players = parseInt(document.getElementById('tMax').value);
    const rawStream = document.getElementById('tStream').value;
    const stream_url = formatYoutubeUrl(rawStream);

    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'apikey': SUPABASE_ANON_KEY, 
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Prefer': 'return=representation'
            },
            body: JSON.stringify({ title, game_name, max_players, status: 'open', stream_url })
        });

        if (res.ok) {
            Swal.fire('نجاح', 'تم إطلاق البطولة وحفظ رابط البث بنجاح!', 'success');
            document.getElementById('createTourForm').reset();
            loadTours();
        } else {
            const errData = await res.json();
            console.error("تفاصيل خطأ إنشاء البطولة:", errData);
            Swal.fire('خطأ', `فشل إنشاء البطولة: ${errData.message || res.statusText}`, 'error');
        }
    } catch (err) {
        console.error("خطأ شبكة:", err);
        Swal.fire('خطأ', 'حدث خطأ في الاتصال بالشبكة.', 'error');
    }
});

// تحميل البطولات
async function loadTours() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments?select=*`, { 
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
    });
    globalTournaments = await res.json();
    
    if(Array.isArray(globalTournaments)) {
        document.getElementById('tList').innerHTML = globalTournaments.map(t => `
            <div class="tour-item">
                <span>
                    <b>${t.title}</b> (${t.game_name}) - السعة: ${t.max_players} | 
                    <span style="color:#10b981; font-weight:bold;">${t.status}</span>
                    ${t.stream_url ? '<span class="badge-live" style="margin-right: 8px;">بث مباشر 🔴</span>' : ''}
                </span>
                <div class="tour-actions">
                    <button class="btn-track" onclick="openTournamentTracker(${t.id}, '${t.title}')">متابعة 🎮</button>
                    <a href="bracket.html?id=${t.id}" target="_blank" class="btn-bracket">📊 الشجرة</a>
                    <button class="btn-edit" onclick="openEditTournamentModal(${t.id}, '${t.title}', '${t.game_name}', ${t.max_players}, '${t.stream_url || ''}', '${t.status}')">تعديل ✏️</button>
                    <button class="btn-danger" onclick="deleteTournament(${t.id})">حذف 🗑️</button>
                </div>
            </div>
        `).join('');
        document.getElementById('drawSelect').innerHTML = '<option value="">اختر البطولة للقرعة...</option>' + globalTournaments.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
    }
}

// نافذة متابعة البطولة واختيار الفائزين للمواجهات (محدثة ومصححة)
async function openTournamentTracker(tourId, tourTitle) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/matches?tournament_id=eq.${tourId}&select=*`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const matches = await res.json();

    if (!matches || matches.length === 0) {
        Swal.fire('تنبيه', 'لا توجد مواجهات مسجلة لهذه البطولة بعد. يرجى عمل قرعة عشوائية أولاً!', 'warning');
        return;
    }

    let matchesHtml = `<div style="max-height: 400px; overflow-y: auto; text-align: right; padding: 5px;">`;
    
    matches.forEach((m, index) => {
        const p1 = globalPlayers.find(pl => pl.id === m.player1_id);
        const p2 = globalPlayers.find(pl => pl.id === m.player2_id);
        
        const p1Name = p1 ? p1.name : 'لاعب غير محدد';
        const p2Name = p2 ? p2.name : (m.player2_id === null ? 'تأهل مباشر (Bye)' : 'لاعب غير محدد');

        matchesHtml += `
            <div style="background: #0d1322; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #1f2937;">
                <div style="font-weight: bold; color: #60a5fa; margin-bottom: 6px;">مواجهة #${index + 1} (${m.round_name || 'دور إقصائي'})</div>
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <span>⚔️ <b>${p1Name}</b> ضد <b>${p2Name}</b></span>
                    ${m.player2_id !== null ? `
                        <select class="match-winner-select" data-match-id="${m.id}" style="width: auto; padding: 6px; background: #111827; color: #fff; border: 1px solid #374151; border-radius: 4px;">
                            <option value="">اختر الفائز...</option>
                            <option value="${m.player1_id}" ${m.winner_id === m.player1_id ? 'selected' : ''}>${p1Name}</option>
                            <option value="${m.player2_id}" ${m.winner_id === m.player2_id ? 'selected' : ''}>${p2Name}</option>
                        </select>
                    ` : `<span style="color: #10b981; font-weight: bold;">تم التأهل تلقائياً</span>`}
                </div>
            </div>
        `;
    });
    matchesHtml += `</div>`;

    const { isConfirmed } = await Swal.fire({
        title: `متابعة مباريات: ${tourTitle}`,
        html: matchesHtml,
        background: '#111827',
        color: '#fff',
        width: '650px',
        showCancelButton: true,
        confirmButtonText: 'حفظ النتائج وتحديث الشجرة 💾',
        cancelButtonText: 'إغلاق',
        preConfirm: () => {
            let updates = [];
            const selects = document.querySelectorAll('.match-winner-select');
            selects.forEach(selectEl => {
                if (selectEl.value) {
                    const matchId = parseInt(selectEl.getAttribute('data-match-id'));
                    const winnerId = parseInt(selectEl.value);
                    updates.push({
                        id: matchId,
                        winner_id: winnerId,
                        status: 'completed'
                    });
                }
            });
            return updates;
        }
    });

    if (isConfirmed && isConfirmed.length > 0) {
        try {
            for (let update of isConfirmed) {
                const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${update.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        winner_id: update.winner_id,
                        status: update.status
                    })
                });

                if (!patchRes.ok) {
                    const errorData = await patchRes.json();
                    console.error("تفاصيل خطأ سوبابيس (التحديث):", errorData);
                    alert("حدث خطأ أثناء تحديث النتيجة: " + (errorData.message || patchRes.statusText));
                    return;
                }
            }
            Swal.fire('تم الحفظ!', 'تم تحديث نتائج المباريات بنجاح، وستظهر في شجرة البطولة.', 'success');
        } catch (err) {
            console.error("خطأ شبكة:", err);
            Swal.fire('خطأ', 'حدث خطأ أثناء حفظ النتائج.', 'error');
        }
    }
}

// نافذة تعديل البطولة

            <div style="text-align: right; margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">اسم البطولة:</label>
                <input id="swal-tour-title" class="swal2-input" value="${currentTitle}" style="width:90%; margin:0; background:#0d1322; color:#fff; border:1px solid #374151;">
            </div>

        `,
        focusConfirm: false,

        cancelButtonText: 'إلغاء',
        preConfirm: () => {
            return {
                title: document.getElementById('swal-tour-title').value,
                game_name: document.getElementById('swal-tour-game').value,
                max_players: parseInt(document.getElementById('swal-tour-max').value),
                status: document.getElementById('swal-tour-status').value,
                stream_url: formatYoutubeUrl(document.getElementById('swal-tour-stream').value)
            }
        }

    if (formValues) {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments?id=eq.${id}`, {
                method: 'PATCH',

                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify(formValues)
            });

            if (res.ok) {
                Swal.fire('تم التعديل!', 'تم تحديث بيانات البطولة بنجاح.', 'success');
                loadTours();
                loadPlayers();
            } else {
                const errData = await res.json();
                console.error("تفاصيل خطأ تحديث البطولة:", errData);
                throw new Error(errData.message || 'فشل تحديث البطولة');
            }
        } catch (err) {
            Swal.fire('خطأ!', 'حدث خطأ أثناء محاولة تعديل البطولة: ' + err.message, 'error');
        }
    }
}

// حذف البطولة
async function deleteTournament(tId) {
    const confirm = await Swal.fire({ 
        title: 'هل تريد حذف هذه البطولة؟', 
        text: 'سيتم حذف بيانات البطولة نهائياً!', 
        icon: 'warning', 
        showCancelButton: true, 
        confirmButtonText: 'نعم، احذف', 
        cancelButtonText: 'إلغاء', 
        background: '#111827', 
        color: '#fff' 
    });
    
    if(confirm.isConfirmed) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments?id=eq.${tId}`, { 
            method: 'DELETE', 
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
        });
        if(res.ok) {
            Swal.fire('تم الحذف', 'تم حذف البطولة بنجاح.', 'success');
            loadTours();
            loadPlayers();
        } else {
            Swal.fire('خطأ', 'فشل حذف البطولة.', 'error');
        }
    }
}

// تحميل اللاعبين
async function loadPlayers() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?select=*`, { 
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
    });
    globalPlayers = await res.json();
    const tbody = document.getElementById('pBody');
    if (!globalPlayers || !globalPlayers.length) { tbody.innerHTML = `<tr><td colspan="7" style="color: #9ca3af;">لا يوجد لاعبين.</td></tr>`; return; }

    tbody.innerHTML = globalPlayers.map(p => {
        const tourObj = globalTournaments.find(t => t.id === p.tournament_id);
        const tourName = tourObj ? tourObj.title : '<span style="color:#ef4444;">غير محددة</span>';
        return `
            <tr>
                <td><b>${p.name}</b></td>
                <td style="color:#60a5fa;">${tourName}</td>
                <td>${p.phone}</td>
                <td><code>${p.game_id}</code></td>
                <td><img src="${p.squad_image_url}" class="squad-thumb" onclick="window.open('${p.squad_image_url}', '_blank')"></td>
                <td style="color:#facc15; font-style:italic;">"${p.tawseya || 'بدون'}"</td>
                <td>
                    <button class="btn-edit" onclick="openEditPlayerModal(${p.id}, '${p.name}', '${p.phone}', '${p.game_id}', '${p.tawseya || ''}', ${p.tournament_id || 'null'})">تعديل ✏️</button>
                    <button class="btn-danger" onclick="del(${p.id})">حذف 🗑️</button>
                </td>
            </tr>
        `;
    }).join('');
}

    const { value: formValues } = await Swal.fire({
        title: 'تعديل بيانات اللاعب',
        background: '#111827',
        color: '#fff',
        html: `
            <div style="text-align: right; margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">اسم اللاعب:</label>
                <input id="swal-input-name" class="swal2-input" value="${currentName}" style="width:90%; margin:0; background:#0d1322; color:#fff; border:1px solid #374151;">
            </div>
            <div style="text-align: right; margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">البطولة المشارك بها:</label>
                <select id="swal-input-tour" class="swal2-input" style="width:90%; margin:0; background:#0d1322; color:#fff; border:1px solid #374151;">
                    <option value="">اختر البطولة</option>
                    ${tourOptionsHtml}
                </select>
            </div>
            <div style="text-align: right; margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">رقم التليفون:</label>
                <input id="swal-input-phone" class="swal2-input" value="${currentPhone}" style="width:90%; margin:0; background:#0d1322; color:#fff; border:1px solid #374151;">
            </div>
            <div style="text-align: right; margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">رقم الـ ID:</label>
                <input id="swal-input-gameid" class="swal2-input" value="${currentGameId}" style="width:90%; margin:0; background:#0d1322; color:#fff; border:1px solid #374151;">
            </div>
            <div style="text-align: right; margin-bottom: 10px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">الوصية:</label>
                <input id="swal-input-tawseya" class="swal2-input" value="${currentTawseya}" style="width:90%; margin:0; background:#0d1322; color:#fff; border:1px solid #374151;">
            </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'حفظ التعديلات',
        cancelButtonText: 'إلغاء',
        preConfirm: () => {
            return {
                name: document.getElementById('swal-input-name').value,
                tournament_id: parseInt(document.getElementById('swal-input-tour').value) || null,
                phone: document.getElementById('swal-input-phone').value,
                game_id: document.getElementById('swal-input-gameid').value,
                tawseya: document.getElementById('swal-input-tawseya').value
            }
        }
    });

    if (formValues) {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/players?id=eq.${id}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify(formValues)
            });

            if (res.ok) {
                Swal.fire('تم التعديل!', 'تم تحديث بيانات اللاعب بنجاح.', 'success');
                loadPlayers();
            } else {
                const errData = await res.json();
                console.error("تفاصيل خطأ تحديث اللاعب:", errData);
                throw new Error(errData.message || 'فشل التحديث');
            }
        } catch (err) {
            Swal.fire('خطأ!', 'حدث خطأ أثناء محاولة تعديل البيانات: ' + err.message, 'error');
        }
    }
}

// حذف لاعب
async function del(id) {
    const confirm = await Swal.fire({ title: 'حذف اللاعب؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم', cancelButtonText: 'إلغاء', background: '#111827', color: '#fff' });
    if(confirm.isConfirmed) {
        await fetch(`${SUPABASE_URL}/rest/v1/players?id=eq.${id}`, { 
            method: 'DELETE', 
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
        });
        loadPlayers();
    }
}

// نظام القرعة العشوائية مع معالجة الأخطاء والرسائل المحدثة
async function runAndSaveDraw() {
    const tId = document.getElementById('drawSelect').value;
    if(!tId) { Swal.fire('تنبيه', 'اختر البطولة أولاً', 'warning'); return; }

    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?tournament_id=eq.${tId}&select=*`, { 
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
    });
    const players = await res.json();
    if(!players || players.length < 2) { Swal.fire('تنبيه', 'لا يوجد عدد كافٍ من اللاعبين المسجلين في هذه البطولة بالتحديد!', 'warning'); return; }

    let arr = [...players].sort(() => Math.random() - 0.5);
    let html = '<h4 style="color:#60a5fa; margin-bottom:10px;">نتائج المواجهات الإقصائية:</h4>';
    
    // مسح المواجهات القديمة أولاً
    await fetch(`${SUPABASE_URL}/rest/v1/matches?tournament_id=eq.${tId}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });

    let matchNum = 1;
    let matchesToInsert = [];

    for(let i = 0; i < arr.length; i += 2) {
        let player1 = arr[i];
        let player2 = arr[i+1] || null;

        if(player2) {
            html += `<div style="background:#0d1322; padding:8px 12px; margin-bottom:6px; border-radius:6px; border-right:3px solid #ef4444;">⚔️ مواجهة #${matchNum}: <b>${player1.name}</b> ضد <b>${player2.name}</b></div>`;
            matchesToInsert.push({
                tournament_id: parseInt(tId),
                round_name: 'دور الـ ' + arr.length,
                player1_id: player1.id,
                player2_id: player2.id,
                winner_id: null,
                status: 'pending'
            });
        } else {
            html += `<div style="background:#0d1322; padding:8px 12px; margin-bottom:6px; border-radius:6px; border-right:3px solid #10b981; color:#10b981;">✨ تأهل مباشر (Bye): <b>${player1.name}</b></div>`;
            matchesToInsert.push({
                tournament_id: parseInt(tId),
                round_name: 'دور الـ ' + arr.length,
                player1_id: player1.id,
                player2_id: null,
                winner_id: player1.id,
                status: 'completed'
            });
        }
        matchNum++;
    }

    // إرسال المواجهات الجديدة مع الكود المطلوب لمعالجة الأخطاء
    const response = await fetch(`${SUPABASE_URL}/rest/v1/matches`, {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        },
        body: JSON.stringify(matchesToInsert)
    });

    if (!response.ok) {
        const errorData = await response.json();
        console.error("تفاصيل خطأ سوبابيس:", errorData); 
        alert("حدث خطأ أثناء حفظ المباريات: " + (errorData.message || response.statusText));
        return;
    }

    document.getElementById('drawResult').innerHTML = html;
    Swal.fire('تمت القرعة والحفظ بنجاح! 🔥', 'تم توليد وتثبيت المواجهات في شجرة البطولة.', 'success');
}

auth();
</script>
