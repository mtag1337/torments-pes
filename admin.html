<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المركزية - البطولات</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b0f19; color: #f3f4f6; padding: 20px; margin: 0; }
        .container { max-width: 950px; margin: auto; }
        .card { background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2, h3 { color: #60a5fa; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #0d1322; color: #fff; box-sizing: border-box; }
        .btn-main { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-danger:hover { background: #b91c1c; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #0d1322; border-radius: 6px; overflow: hidden; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #1f2937; font-size: 14px; }
        th { background: #1f2937; color: #60a5fa; }
        img.squad-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #3b82f6; }
        img.squad-thumb:hover { transform: scale(1.1); }
        .tour-item { background: #0d1322; padding: 10px 15px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1f2937; }
    </style>
</head>
<body>

<div class="container" id="panel" style="display: none;">
    <h2>🎮 لوحة تحكم المنظم والبطولات</h2>

    <!-- قسم إنشاء البطولة -->
    <div class="card">
        <h3>إنشاء بطولة جديدة وبث مباشر</h3>
        <form id="createTourForm">
            <div class="form-group">
                <label>اسم البطولة:</label>
                <input type="text" id="tTitle" required placeholder="مثال: بطولة الموسم الأول لـ PUBG">
            </div>
            <div class="form-group">
                <label>اسم اللعبة:</label>
                <input type="text" id="tGame" required placeholder="PUBG Mobile / eFootball">
            </div>
            <div class="form-group">
                <label>الحد الأقصى لعدد اللاعبين:</label>
                <input type="number" id="tMax" value="16" required>
            </div>
            <div class="form-group">
                <label>رابط بث اليوتيوب (يقبل الرابط العادي أو الـ Embed):</label>
                <input type="text" id="tStream" placeholder="https://www.youtube.com/watch?v=xxxxxx">
            </div>
            <button type="submit" class="btn-main">🚀 إطلاق البطولة الآن</button>
        </form>
    </div>

    <!-- البطولات الحالية -->
    <div class="card">
        <h3>البطولات المسجلة</h3>
        <div id="tList">جاري التحميل...</div>
    </div>

    <!-- قسم القرعة العشوائية الحماسية -->
    <div class="card" style="background: #1e1b4b; text-align: center;">
        <h3>🎲 نظام القرعة العشوائية للمواجهات</h3>
        <div class="form-group" style="max-width: 400px; margin: 10px auto;">
            <select id="drawSelect"><option value="">اختر البطولة لإجراء القرعة...</option></select>
        </div>
        <button onclick="runDraw()" class="btn-main" style="background: #10b981; max-width: 400px; margin: auto;">بدء القرعة عشوائياً 🔥</button>
        <div id="drawResult" style="margin-top: 15px; text-align: right;"></div>
    </div>

    <!-- اللاعبون المسجلون -->
    <div class="card">
        <h3>اللاعبون المسجلون بالبطولة</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>التليفون</th>
                        <th>الـ ID</th>
                        <th>التشكيلة</th>
                        <th>الوصية</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="pBody">
                    <tr><td colspan="6" style="color: #9ca3af;">لا يوجد لاعبين مسجلين.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://pudnffhwusacrquqcjei.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Sveiq2WcgtBoIa7KMjlK3g_MCFXLVjK";

// حماية الباسورد
async function auth() {
    const { value: pass } = await Swal.fire({ title: 'كلمة مرور الأدمن', input: 'password', allowOutsideClick: false, background: '#111827', color: '#fff' });
    if (pass === "taj2026") {
        document.getElementById('panel').style.display = 'block';
        loadTours();
        loadPlayers();
    } else { auth(); }
}

// دالة ذكية لتحويل رابط يوتيوب العادي إلى صيغة الـ Embed تلقائياً
function formatYoutubeUrl(url) {
    if (!url) return '';
    url = url.trim();
    if (url.includes('/embed/')) return url;
    
    let videoId = '';
    if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
    } else if (url.includes('watch?v=')) {
        videoId = url.split('watch?v=')[1].split('&')[0];
    }
    
    if (videoId) {
        return `https://www.youtube.com/embed/${videoId}`;
    }
    return url;
}

// إنشاء بطولة جديدة مع رابط البث المتحول تلقائياً
document.getElementById('createTourForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('tTitle').value;
    const game_name = document.getElementById('tGame').value;
    const max_players = parseInt(document.getElementById('tMax').value);
    const rawStream = document.getElementById('tStream').value;
    
    // تحويل الرابط تلقائياً
    const stream_url = formatYoutubeUrl(rawStream);

    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'apikey': SUPABASE_ANON_KEY, 
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Prefer': 'return=representation'
            },
            body: JSON.stringify({ 
                title: title, 
                game_name: game_name, 
                max_players: max_players, 
                status: 'open',
                stream_url: stream_url 
            })
        });

        if (res.ok) {
            Swal.fire('نجاح', 'تم إطلاق البطولة وحفظ رابط البث بنجاح!', 'success');
            document.getElementById('createTourForm').reset();
            loadTours();
        } else {
            const errData = await res.json();
            console.error("Supabase Error:", errData);
            Swal.fire('خطأ', `فشل إنشاء البطولة: ${errData.message || 'خطأ غير معروف'}`, 'error');
        }
    } catch (err) {
        console.error("Network Error:", err);
        Swal.fire('خطأ', 'حدث خطأ في الاتصال بالشبكة.', 'error');
    }
});

// تحميل البطولات مع زر الحذف الخاص بها
async function loadTours() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments?select=*`, { 
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
    });
    const data = await res.json();
    
    if(Array.isArray(data)) {
        document.getElementById('tList').innerHTML = data.map(t => `
            <div class="tour-item">
                <span><b>${t.title}</b> (${t.game_name}) - السعة: ${t.max_players} | <span style="color:#10b981; font-weight:bold;">${t.status}</span></span>
                <button class="btn-danger" onclick="deleteTournament(${t.id})">حذف البطولة 🗑️</button>
            </div>
        `).join('');
        document.getElementById('drawSelect').innerHTML = '<option value="">اختر البطولة للقرعة...</option>' + data.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
    }
}

// دالة حذف البطولة من القاعدة
async function deleteTournament(tId) {
    const confirm = await Swal.fire({ 
        title: 'هل تريد حذف هذه البطولة؟', 
        text: 'سيتم حذف بيانات البطولة نهائياً!', 
        icon: 'warning', 
        showCancelButton: true, 
        confirmButtonText: 'نعم، احذف', 
        cancelButtonText: 'إلغاء', 
        background: '#111827', 
        color: '#fff' 
    });
    
    if(confirm.isConfirmed) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments?id=eq.${tId}`, { 
            method: 'DELETE', 
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
        });
        if(res.ok) {
            Swal.fire('تم الحذف', 'تم حذف البطولة بنجاح.', 'success');
            loadTours();
        } else {
            Swal.fire('خطأ', 'فشل حذف البطولة.', 'error');
        }
    }
}

// تحميل اللاعبين
async function loadPlayers() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?select=*`, { 
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
    });
    const players = await res.json();
    const tbody = document.getElementById('pBody');
    if (!players || !players.length) { tbody.innerHTML = `<tr><td colspan="6" style="color: #9ca3af;">لا يوجد لاعبين.</td></tr>`; return; }

    tbody.innerHTML = players.map(p => `
        <tr>
            <td><b>${p.name}</b></td>
            <td>${p.phone}</td>
            <td><code>${p.game_id}</code></td>
            <td><img src="${p.squad_image_url}" class="squad-thumb" onclick="window.open('${p.squad_image_url}', '_blank')"></td>
            <td style="color:#facc15; font-style:italic;">"${p.tawseya || 'بدون'}"</td>
            <td><button class="btn-danger" onclick="del(${p.id})">حذف</button></td>
        </tr>
    `).join('');
}

// حذف لاعب
async function del(id) {
    const confirm = await Swal.fire({ title: 'حذف اللاعب؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم', cancelButtonText: 'إلغاء', background: '#111827', color: '#fff' });
    if(confirm.isConfirmed) {
        await fetch(`${SUPABASE_URL}/rest/v1/players?id=eq.${id}`, { 
            method: 'DELETE', 
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
        });
        loadPlayers();
    }
}

// قرعة عشوائية للمواجهات
async function runDraw() {
    const tId = document.getElementById('drawSelect').value;
    if(!tId) { Swal.fire('تنبيه', 'اختر البطولة أولاً', 'warning'); return; }

    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?tournament_id=eq.${tId}&select=*`, { 
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } 
    });
    const players = await res.json();
    if(!players || players.length < 2) { Swal.fire('تنبيه', 'اللاعبين المسجلين أقل من لاعبين اثنين!', 'warning'); return; }

    let arr = [...players].sort(() => Math.random() - 0.5);
    let html = '<h4 style="color:#60a5fa; margin-bottom:10px;">نتائج المواجهات الإقصائية:</h4>';
    
    let matchNum = 1;
    for(let i=0; i<arr.length; i+=2) {
        if(arr[i+1]) {
            html += `<div style="background:#0d1322; padding:8px 12px; margin-bottom:6px; border-radius:6px; border-right:3px solid #ef4444;">⚔️ مواجهة #${matchNum}: <b>${arr.at(i).name}</b> ضد <b>${arr.at(i+1).name}</b></div>`;
        } else {
            html += `<div style="background:#0d1322; padding:8px 12px; margin-bottom:6px; border-radius:6px; border-right:3px solid #10b981; color:#10b981;">✨ تأهل مباشر (Bye): <b>${arr.at(i).name}</b></div>`;
        }
        matchNum++;
    }
    document.getElementById('drawResult').innerHTML = html;
    Swal.fire('تمت القرعة بنجاح! 🔥', 'تم توليد المواجهات العشوائية.', 'success');
}

auth();
</script>
</body>
</html>
